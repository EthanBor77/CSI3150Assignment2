<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Greenhouse Logs</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="portal-header">
      <h1>AgroSense Greenhouse Telemetry Portal</h1>
      <nav class="portal-nav">
        <a href="#input-section">Sensor Entry</a>
        <a href="#log-section">Telemetry Logs</a>
      </nav>
    </header>
    <main class="portal-main">
      <section id="input-section" class="input-panel">
        <header class="panel-header">
          <h2>Record Bay Telemetry</h2>
        </header>
        <form id="sensor-form">
          <div class="input-group">
            <label for="bay-input">Bay Identifier</label>
            <input
              id="bay-input"
              type="text"
              placeholder="e.g., Bay-01"
              required
            />
          </div>
          <div class="input-group">
            <label for="ph-input">pH Level (0 - 14)</label>
            <input
              id="ph-input"
              type="number"
              min="0"
              max="14"
              step="0.1"
              required
            />
          </div>
          <div class="input-group">
            <label for="ec-input">Electrical Conductivity (mS/cm)</label>
            <input
              id="ec-input"
              type="number"
              min="0"
              max="10"
              step="0.1"
              required
            />
          </div>
          <div class="input-group">
            <label for="temp-input">Air Temperature (F)</label>
            <input
              id="temp-input"
              type="number"
              min="32"
              max="120"
              step="0.1"
              required
            />
          </div>
          <div class="input-group">
            <label for="rh-input">Relative Humidity (%)</label>
            <input
              id="rh-input"
              type="number"
              min="0"
              max="100"
              step="1"
              required
            />
          </div>
          <button id="btn-submit" type="submit">Record Reading</button>
        </form>
      </section>

      <section id="log-section" class="output-panel">
        <header class="output-header">
          <h2>Active Telemetry Logs</h2>
          <button class="danger-btn">Purge Queue</button>
        </header>
        <div id="log-container" class="log-queue">
          <article class="log-card">
            <div class="log-details">
              <h3>Bay-01 | Optimal</h3>
              <p>pH: 6.2 | EC: 1.5 mS/cm | Temp: 68F | RH: 60%</p>
            </div>
            <button class="btn-delete-log">Delete</button>
          </article>
        </div>
      </section>
    </main>
    <footer class="portal-footer">
      <p>AgroSense Systems - Field Operations Unit</p>
    </footer>
  </body>
</html>
